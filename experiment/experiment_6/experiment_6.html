<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart To-Do List</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
    background:linear-gradient(135deg,#fbc2eb,#a6c1ee,#c2ffd8);
}

.container{
    width:100%;
    max-width:760px;
    background:rgba(255,255,255,0.96);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 22px 55px rgba(0,0,0,0.18);
}

/* HEADER */

.header{
    text-align:center;
    padding:30px 20px;
    color:white;
    background:linear-gradient(135deg,#7c3aed,#2563eb,#ec4899);
}

.header h1{
    font-size:32px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
    opacity:0.9;
}

/* STUDENT INFO */

.student-info{
    margin:20px 28px 0;
    background:#f5f3ff;
    border-left:5px solid #8b5cf6;
    border-radius:12px;
    padding:12px 17px;
    display:flex;
    justify-content:space-between;
    color:#4c1d95;
    font-weight:600;
}

/* MAIN CONTENT */

.content{
    padding:28px;
}

.input-box{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.input-box input{
    flex:1;
    padding:13px;
    border:1.5px solid #d1d5db;
    border-radius:11px;
    outline:none;
    font-size:14px;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,0.13);
}

.add-btn{
    border:none;
    padding:12px 22px;
    border-radius:11px;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.add-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(124,58,237,0.28);
}

/* INFO BAR */

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    background:#f8fafc;
    padding:12px 15px;
    border-radius:10px;
    font-size:13px;
    color:#475569;
}

.info-bar strong{
    color:#7c3aed;
}

/* TASK LIST */

#taskList{
    list-style:none;
}

.task{
    display:flex;
    align-items:center;
    gap:12px;
    background:#faf5ff;
    border:1px solid #ede9fe;
    padding:14px;
    border-radius:13px;
    margin-bottom:11px;
    transition:0.3s;
}

.task:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 16px rgba(0,0,0,0.08);
}

.task-number{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ddd6fe;
    color:#6d28d9;
    font-weight:bold;
}

.task-text{
    flex:1;
    color:#374151;
    font-size:15px;
}

.task.completed .task-text{
    text-decoration:line-through;
    color:#9ca3af;
}

.task.completed{
    background:#ecfdf5;
}

/* BUTTONS */

.actions{
    display:flex;
    gap:7px;
}

.actions button{
    border:none;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.done-btn{
    background:#dcfce7;
    color:#15803d;
}

.edit-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

/* EMPTY MESSAGE */

.empty-message{
    text-align:center;
    padding:30px;
    color:#94a3b8;
    background:#f8fafc;
    border-radius:12px;
}

/* FOOTER */

.footer{
    text-align:center;
    background:#f8fafc;
    padding:15px;
    font-size:12px;
    color:#64748b;
}

.footer strong{
    color:#7c3aed;
}

@media(max-width:650px){

    .student-info{
        flex-direction:column;
        gap:5px;
    }

    .input-box{
        flex-direction:column;
    }

    .task{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .actions{
        width:100%;
        justify-content:flex-end;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✨ My Smart To-Do List</h1>
        <p>DOM Traversal • Dynamic Updates • Add • Edit • Delete</p>
    </div>

    <div class="student-info">
        <span>👩‍💻 Nandini Daharwal</span>
        <span>🎓 PRN: 24070521152</span>
    </div>

    <div class="content">

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task...">

            <button
                class="add-btn"
                onclick="addTask()">
                + Add Task
            </button>

        </div>

        <div class="info-bar">

            <span>
                Total Tasks:
                <strong id="totalTasks">0</strong>
            </span>

            <span>
                Completed:
                <strong id="completedTasks">0</strong>
            </span>

        </div>

        <ul id="taskList"></ul>

    </div>

    <div class="footer">
        Designed by <strong>Nandini Daharwal</strong>
        | PRN: <strong>24070521152</strong>
    </div>

</div>


<script>

const taskInput =
    document.getElementById("taskInput");

const taskList =
    document.getElementById("taskList");


/* ADD TASK */

function addTask(){

    const taskText =
        taskInput.value.trim();

    if(taskText === ""){

        alert("Please enter a task.");
        return;
    }


    /* Create LI element */

    const li =
        document.createElement("li");

    li.className = "task";


    li.innerHTML = `

        <div class="task-number"></div>

        <span class="task-text">
            ${taskText}
        </span>

        <div class="actions">

            <button
                class="done-btn"
                onclick="completeTask(this)">
                ✓ Done
            </button>

            <button
                class="edit-btn"
                onclick="editTask(this)">
                ✏ Edit
            </button>

            <button
                class="delete-btn"
                onclick="deleteTask(this)">
                🗑 Delete
            </button>

        </div>

    `;


    /* Append child to UL */

    taskList.appendChild(li);

    taskInput.value = "";

    updateTaskNumbers();

    updateCounts();
}


/* COMPLETE TASK */

function completeTask(button){

    /*
      DOM Traversal:
      parentElement = actions div
      parentElement.parentElement = li
    */

    const taskItem =
        button.parentElement.parentElement;

    taskItem.classList.toggle("completed");

    updateCounts();
}


/* EDIT TASK */

function editTask(button){

    const taskItem =
        button.parentElement.parentElement;

    /*
      querySelector searches inside
      the selected parent element
    */

    const taskText =
        taskItem.querySelector(".task-text");


    const newText =
        prompt(
            "Edit your task:",
            taskText.innerText
        );


    if(newText !== null &&
       newText.trim() !== ""){

        taskText.innerText =
            newText.trim();
    }
}


/* DELETE TASK */

function deleteTask(button){

    /*
      Traverse from button
      to parent task
    */

    const taskItem =
        button.closest(".task");


    const confirmDelete =
        confirm("Do you want to delete this task?");


    if(confirmDelete){

        taskItem.remove();

        updateTaskNumbers();

        updateCounts();
    }
}


/* UPDATE TASK NUMBERS */

function updateTaskNumbers(){

    const tasks =
        document.querySelectorAll(".task");


    tasks.forEach((task,index) => {

        const number =
            task.querySelector(".task-number");

        number.innerText =
            index + 1;
    });
}


/* UPDATE COUNTS */

function updateCounts(){

    const total =
        document.querySelectorAll(".task").length;

    const completed =
        document.querySelectorAll(
            ".task.completed"
        ).length;


    document.getElementById(
        "totalTasks"
    ).innerText = total;


    document.getElementById(
        "completedTasks"
    ).innerText = completed;


    showEmptyMessage();
}


/* EMPTY LIST MESSAGE */

function showEmptyMessage(){

    let empty =
        document.getElementById("emptyMessage");


    const total =
        document.querySelectorAll(".task").length;


    if(total === 0){

        if(!empty){

            empty =
                document.createElement("div");

            empty.id =
                "emptyMessage";

            empty.className =
                "empty-message";

            empty.innerHTML =
                "📝 No tasks yet.<br>Add your first task above!";

            taskList.parentElement.appendChild(empty);
        }

    }

    else{

        if(empty){

            empty.remove();
        }

    }
}


/* PRESS ENTER TO ADD */

taskInput.addEventListener(
    "keypress",
    function(event){

        if(event.key === "Enter"){

            addTask();
        }

    }
);


/* INITIAL STATE */

showEmptyMessage();

</script>

</body>
</html>
