<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:500px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    text-align:center;
}

h1{
    color:#2c3e50;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:15px 0;
    font-size:18px;
    border:2px solid #4e54c8;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#4e54c8;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#303f9f;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f4f4f4;
    font-size:20px;
    font-weight:bold;
}
</style>

<script>

// Global Scope
let appName = "Palindrome Checker";

// Closure Function
function counter(){
    let count = 0;
    return function(){
        count++;
        return count;
    }
}

const clickCounter = counter();

// Arrow Function
const reverseText = (text) => {
    return text.split("").reverse().join("");
};

// Function Declaration
function checkPalindrome(){

    try{

        let word = document.getElementById("word").value.trim();

        if(word===""){
            throw "Please enter a word.";
        }

        let reversed = reverseText(word.toLowerCase());

        let message="";

        if(word.toLowerCase()===reversed){
            message="✅ '"+word+"' is a Palindrome.";
        }
        else{
            message="❌ '"+word+"' is NOT a Palindrome.";
        }

        document.getElementById("result").innerHTML=
        message+
        "<br><br>Checked : "+clickCounter()+" time(s)";

    }

    catch(error){

        alert(error);

    }

}

</script>

</head>

<body>

<div class="container">

<h1>🔄 Palindrome Checker</h1>

<p>Enter a word or number</p>

<input
type="text"
id="word"
placeholder="Example: madam">

<button onclick="checkPalindrome()">
Check Palindrome
</button>

<div id="result">
Result will appear here.
</div>

</div>

</body>
</html>
